## IDF Component Manager Manifest File
dependencies:
  idf: '>=5.0'
  image_player:
    version: '*'
    override_path: ../../
  esp_mmap_assets:
    version: 1.*
  lvgl/lvgl:
    version: ">=8,<9"

  espressif/esp-box:
    version: "^3.1.*"
    rules:
    - if: "${IDF_TARGET} == esp32s3"

  espressif/esp32_c3_lcdkit:
    version: "^1.1.*"
    rules:
    - if: "${IDF_TARGET} == esp32c3"

  espressif/esp_wrover_kit:
    version: "^1.6.*"
    rules:
    - if: "${IDF_TARGET} == esp32"
